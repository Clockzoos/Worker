<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (window.location.pathname.endsWith('index.html')) {
            window.location.replace(window.location.pathname.replace(/index\.html$/, '') + window.location.search + window.location.hash);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Giveaway Hub</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --surface: #050505;
            --surface-hover: #111111;
            --color-primary: #eab308;
            --color-primary-hover: #ca8a04;
            --color-primary-dim: rgba(234, 179, 8, 0.1);
            --color-border: #1a1a1a;
            --color-text: #ffffff;
            --color-text-muted: #a0a0a0;
            --color-danger: #ef4444;
            --color-danger-hover: #dc2626;
            --color-success: #22c55e;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); cursor: pointer; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-primary);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            position: fixed; top: 0; width: 100%; height: 64px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border); z-index: 1000;
        }

        .nav-content {
            max-width: 1400px; margin: 0 auto; height: 100%; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; background: none; border: none; padding: 0; }
        .nav-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .nav-title { font-weight: 700; font-size: 18px; color: #ffffff; }

        .nav-center { flex: 1; display: flex; justify-content: center; padding: 0 32px; }
        .search-wrapper { position: relative; width: 100%; max-width: 520px; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }

        #search {
            width: 100%; background: var(--surface); border: 1px solid var(--color-border);
            color: var(--color-text); padding: 11px 20px 11px 44px; border-radius: 12px; font-size: 14px;
        }
        #search:focus { border-color: var(--color-primary); background: var(--bg-secondary); outline: none; }

        .container { max-width: 1400px; margin: 84px auto 40px; padding: 0 32px; min-height: calc(100vh - 124px); }
        .content-wrapper { display: grid; grid-template-columns: 260px 1fr; gap: 48px; }
        .sidebar { position: sticky; top: 100px; height: fit-content; }

        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 11px 14px;
            color: var(--color-text-muted); text-decoration: none; font-size: 14px; font-weight: 600;
            border-radius: 10px; margin-bottom: 6px; transition: 0.2s;
        }
        .sidebar-link:hover { color: var(--color-text); background: var(--surface); }
        .sidebar-link.active { color: var(--color-primary); background: var(--color-primary-dim); }

        .sidebar-sort {
            width: 100%; padding: 11px 14px; color: var(--color-text-muted); background: transparent;
            border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; margin-bottom: 6px; cursor: pointer;
        }

        .giveaway-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .giveaway-card {
            background: var(--surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 28px;
            cursor: pointer; transition: 0.25s; display: flex; flex-direction: column;
        }
        .giveaway-card:hover { transform: translateY(-4px); border-color: var(--color-primary); }
        .giveaway-title { font-size: 16px; font-weight: 700; color: #fff; word-break: break-word; }
        .card-description { color: var(--color-text-muted); font-size: 13px; margin: 10px 0; }
        .card-meta { margin-top: auto; padding-top: 16px; font-size: 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }

        .badge { font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 8px; text-transform: uppercase; }
        .badge-active { background: var(--color-success); color: #000; }
        .badge-ended { background: var(--color-danger); color: #fff; }
        .badge-public { background: var(--color-primary); color: #000; }
        .badge-private { background: var(--surface-hover); color: var(--color-text-muted); border: 1px solid var(--color-border); }

        .detail-box { background: var(--surface); border: 1px solid var(--color-border); border-radius: 16px; overflow: hidden; margin-top: 20px; padding: 32px; }
        .account-reveal-box { background: var(--bg-secondary); border: 1px dashed var(--color-primary); padding: 20px; border-radius: 12px; margin: 20px 0; }

        .admin-panel { max-width: 900px; margin: 0 auto; }
        .admin-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid var(--color-border); padding-bottom: 24px; }
        .tab-switcher { background: var(--bg-secondary); padding: 5px; border-radius: 12px; border: 1px solid var(--color-border); display: flex; gap: 4px; }
        .tab-btn { background: transparent; border: none; color: var(--color-text-muted); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: var(--surface); color: #fff; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); padding: 20px; }
        .modal { background: var(--surface); border: 1px solid var(--color-border); border-radius: 20px; width: 100%; max-width: 420px; padding: 32px; }
        .close-btn { background: none; border: none; color: var(--color-text-muted); font-size: 28px; cursor: pointer; }

        .editor-container { background: var(--surface); padding: 36px; border-radius: 16px; border: 1px solid var(--color-border); margin-top: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; }
        .input-field { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--color-border); color: #fff; border-radius: 10px; font-size: 14px; }
        .input-field:focus { border-color: var(--color-primary); outline: none; }
        textarea.input-field { resize: vertical; min-height: 120px; }

        .btn { background: var(--color-primary); color: #000; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.2s; text-decoration: none; }
        .btn:hover { background: var(--color-primary-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--color-border); color: #fff; }
        .btn-secondary:hover { background: var(--surface); }
        .btn-delete { background: var(--color-danger); color: #fff; }
        .btn-success { background: var(--color-success); color: #fff; }

        .admin-item { padding: 22px; background: var(--bg-secondary); border-radius: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--color-border); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .content-wrapper { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .nav-content { padding: 0 16px; }
            .container { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <button class="brand" onclick="app.navigate('')">
                <img src="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg" class="nav-icon" alt="Icon">
                <span class="nav-title">Roblox Giveaways</span>
            </button>
            <div class="nav-center">
                <div class="search-wrapper">
                    <i class="search-icon">🔍</i>
                    <input type="text" id="search" placeholder="Cari giveaway akun..." oninput="app.handleSearch(this.value)">
                </div>
            </div>
            <div class="nav-right">
                <div id="auth-section">
                    <button class="btn btn-secondary btn-sm" onclick="app.toggleLoginModal()">Login Admin</button>
                </div>
                <div id="user-section" style="display:none">
                    <button class="btn btn-primary btn-sm" onclick="app.navigate('admin')">Admin Panel</button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this) app.toggleLoginModal()">
        <div class="modal">
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3 style="color:var(--color-primary)">Admin Login</h3>
                <button class="close-btn" onclick="app.toggleLoginModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="admin-email" class="input-field" placeholder="Masukkan email admin...">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-pass" class="input-field" placeholder="Masukkan password..." onkeypress="if(event.key==='Enter') app.login()">
                </div>
                <div id="login-error" style="color:var(--color-danger);font-size:13px;margin:10px 0;display:none"></div>
                <button class="btn" style="width:100%;justify-content:center;" onclick="app.login()">Login</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- HOME VIEW -->
        <div id="view-home" class="view-section" style="display:block">
            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="sidebar-links">
                        <a href="#" class="sidebar-link active" onclick="event.preventDefault(); app.filterCategory('all', event)">🎁 Semua Event</a>
                        <a href="#" class="sidebar-link" onclick="event.preventDefault(); app.filterCategory('active', event)">🔥 Sedang Berjalan</a>
                        <a href="#" class="sidebar-link" onclick="event.preventDefault(); app.filterCategory('ended', event)">🏆 Selesai / Pemenang</a>
                        <select id="sort-select" class="sidebar-sort" onchange="app.setSort(this.value)">
                            <option value="created">Terbaru</option>
                            <option value="az">Judul A → Z</option>
                        </select>
                        <a href="#" class="sidebar-link" id="private-filter" style="display:none" onclick="event.preventDefault(); app.filterCategory('private', event)">🔒 Private</a>
                    </div>
                </aside>
                <main class="main-content">
                    <div class="giveaway-grid" id="giveaway-list">
                        <div style="text-align:center;padding:60px 0;grid-column:1/-1">
                            <div class="spinner"></div>
                            <p>Memuat data dari Firebase...</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="view-detail" class="view-section" style="display:none">
            <button class="btn btn-secondary btn-sm" onclick="app.navigate('')" style="margin-bottom:20px;">← Kembali</button>
            <div id="giveaway-detail-content"></div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="view-admin" class="view-section" style="display:none">
            <div class="admin-panel">
                <div class="admin-header-flex">
                    <h2>Admin Giveaway Panel</h2>
                    <div class="tab-switcher">
                        <button class="tab-btn active" onclick="app.switchAdminTab('list')">Daftar Event</button>
                        <button class="tab-btn" onclick="app.switchAdminTab('create')">Buat Event Baru</button>
                        <button class="tab-btn" onclick="app.logout()" style="color:var(--color-danger)">Logout</button>
                    </div>
                </div>

                <div id="admin-tab-editor" class="admin-tab" style="display:none">
                    <div class="editor-container">
                        <h3 id="editor-heading" style="margin-bottom:20px;">Buat Giveaway Baru</h3>
                        <input type="hidden" id="edit-id">
                        <div class="form-group">
                            <label>Judul Giveaway</label>
                            <input type="text" id="edit-title" class="input-field" placeholder="Contoh: Akun Roblox Robux 5000">
                        </div>
                        <div class="form-group">
                            <label>Visibility</label>
                            <select id="edit-visibility" class="input-field">
                                <option value="PUBLIC">Public</option>
                                <option value="PRIVATE">Private</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status Event</label>
                            <select id="edit-status" class="input-field">
                                <option value="active">Active (Sedang Jalan)</option>
                                <option value="ended">Ended (Selesai/Sudah Diundi)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Deskripsi & Syarat Ikut Undian</label>
                            <textarea id="edit-desc" class="input-field" placeholder="Tulis syarat ikutan (Misal: Join Discord, Komen Nickname Roblox)..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Detail Akun Roblox (Username & Password / Kode)</label>
                            <input type="text" id="edit-account" class="input-field" placeholder="User: RobloxID | Pass: KataSandi123">
                            <small style="color:var(--color-text-muted)">Hanya akan terbuka/muncul jika pemenang diumumkan atau event selesai.</small>
                        </div>
                        <div class="form-group">
                            <label>Nama Pemenang (Isi jika sudah diundi)</label>
                            <input type="text" id="edit-winner" class="input-field" placeholder="Contoh: @BudiGamer_Rbx (Kosongkan jika belum)">
                        </div>
                        <div style="display:flex;gap:10px;justify-content:flex-end;">
                            <button class="btn btn-secondary" onclick="app.switchAdminTab('list')">Batal</button>
                            <button class="btn" onclick="app.saveGiveaway()">Simpan ke Firebase</button>
                        </div>
                    </div>
                </div>

                <div id="admin-tab-list" class="admin-tab" style="display:block">
                    <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                        <h3>Kelola Giveaway</h3>
                        <span id="total-stats" style="color:var(--color-text-muted)">0 event</span>
                    </div>
                    <div id="admin-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCQRLQnKz3sP5IhmrESe978mNWrckCrBjE",
          authDomain: "clock-backup.firebaseapp.com",
          projectId: "clock-backup",
          storageBucket: "clock-backup.firebasestorage.app",
          messagingSenderId: "987850564905",
          appId: "1:987850564905:web:e1a87690cac1015560c338"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        window.app = {
            giveaways: [],
            currentFilter: 'all',
            currentSort: 'created',
            isAdmin: false,

            init() {
                onAuthStateChanged(auth, (user) => {
                    this.isAdmin = !!user;
                    this.checkAuthUI();
                    this.loadGiveaways();
                });
                window.addEventListener('hashchange', () => this.router());
                this.router();
            },

            toggleLoginModal() {
                const modal = document.getElementById('login-modal');
                modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
            },

            async login() {
                const email = document.getElementById('admin-email').value.trim();
                const pass = document.getElementById('admin-pass').value.trim();
                const errEl = document.getElementById('login-error');

                if (!email || !pass) {
                    errEl.style.display = 'block';
                    errEl.textContent = 'Email dan password wajib diisi!';
                    return;
                }

                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    this.toggleLoginModal();
                    Toastify({ text: "Berhasil login sebagai Admin!", duration: 3000, style: { background: "#eab308", color: "#000" } }).showToast();
                    this.navigate('admin');
                } catch (e) {
                    console.error(e);
                    errEl.style.display = 'block';
                    errEl.textContent = 'Login gagal! Email atau password salah.';
                }
            },

            async logout() {
                await signOut(auth);
                this.navigate('');
                Toastify({ text: "Berhasil logout", duration: 2000 }).showToast();
            },

            checkAuthUI() {
                document.getElementById('auth-section').style.display = this.isAdmin ? 'none' : 'block';
                document.getElementById('user-section').style.display = this.isAdmin ? 'block' : 'none';
                const privateFilter = document.getElementById('private-filter');
                if (privateFilter) privateFilter.style.display = this.isAdmin ? 'flex' : 'none';
            },

            async loadGiveaways() {
                try {
                    const querySnapshot = await getDocs(collection(db, "giveaways"));
                    this.giveaways = [];
                    querySnapshot.forEach((docSnap) => {
                        this.giveaways.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    this.giveaways.sort((a, b) => new Date(b.created) - new Date(a.created));
                    this.renderGiveaways();
                    this.renderAdminList();
                } catch (e) {
                    console.error("Gagal memuat dari Firebase:", e);
                }
            },

            renderGiveaways() {
                const listEl = document.getElementById('giveaway-list');
                let filtered = this.giveaways.filter(g => {
                    if (this.currentFilter === 'active') return g.status === 'active';
                    if (this.currentFilter === 'ended') return g.status === 'ended';
                    if (this.currentFilter === 'private') return g.visibility === 'PRIVATE';
                    return this.isAdmin || g.visibility === 'PUBLIC';
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = `<div style="text-align:center;padding:50px;grid-column:1/-1;"><h2>Tidak ada event giveaway</h2></div>`;
                    return;
                }

                listEl.innerHTML = filtered.map(g => `
                    <div class="giveaway-card" onclick="app.viewDetail('${g.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                            <span class="giveaway-title">${g.title}</span>
                            <span class="badge badge-${g.status}">${g.status.toUpperCase()}</span>
                        </div>
                        <p class="card-description">${g.description || 'Tidak ada deskripsi.'}</p>
                        <div class="card-meta">
                            <span>Pemenang: <strong>${g.winner ? g.winner : 'Belum diundi'}</strong></span>
                            <span class="badge badge-${g.visibility.toLowerCase()}">${g.visibility}</span>
                        </div>
                    </div>
                `).join('');
            },

            renderAdminList() {
                const adminList = document.getElementById('admin-list');
                document.getElementById('total-stats').textContent = `${this.giveaways.length} total event`;
                
                adminList.innerHTML = this.giveaways.map(g => `
                    <div class="admin-item">
                        <div>
                            <strong>${g.title}</strong>
                            <div style="font-size:12px;color:var(--color-text-muted)">Status: ${g.status} | Pemenang: ${g.winner || 'Belum ada'}</div>
                        </div>
                        <div style="display:flex;gap:10px;">
                            <button class="btn btn-secondary btn-sm" onclick="app.editGiveaway('${g.id}')">Edit</button>
                            <button class="btn btn-delete btn-sm" onclick="app.deleteGiveaway('${g.id}')">Hapus</button>
                        </div>
                    </div>
                `).join('');
            },

            viewDetail(id) { location.hash = `#giveaway/${id}`; },

            navigate(view) {
                if (view === 'admin' && !this.isAdmin) {
                    this.toggleLoginModal();
                    return;
                }
                location.hash = view ? `#${view}` : '#';
            },

            router() {
                const hash = location.hash.slice(1);
                document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');

                if (hash.startsWith('giveaway/')) {
                    document.getElementById('view-detail').style.display = 'block';
                    const id = hash.split('/')[1];
                    const g = this.giveaways.find(item => item.id === id);
                    if (g) {
                        let winnerBox = g.winner 
                            ? `<div style="background:var(--color-primary-dim);border:1px solid var(--color-primary);padding:16px;border-radius:12px;margin-bottom:20px;">
                                 🏆 <strong>Pemenang Terpilih:</strong> <span style="color:var(--color-primary);font-weight:bold;font-size:16px;">${g.winner}</span>
                               </div>`
                            : `<div style="background:var(--surface-hover);padding:16px;border-radius:12px;margin-bottom:20px;color:var(--color-text-muted)">
                                 ⏳ Undian masih berlangsung. Pemenang akan diumumkan segera!
                               </div>`;

                        let accountReveal = (g.winner && g.accountDetails)
                            ? `<div class="account-reveal-box">
                                 <h4 style="color:var(--color-primary);margin-bottom:8px;">🎁 Detail Akun Roblox Pemenang:</h4>
                                 <p style="font-family:monospace;font-size:14px;color:#fff;word-break:break-all;" id="acc-text">${g.accountDetails}</p>
                                 <button class="btn btn-sm" style="margin-top:12px;" onclick="app.copyAccount()">Salin Akun</button>
                               </div>`
                            : `<p style="color:var(--color-text-muted);font-size:13px;font-style:italic;">Detail akun roblox baru akan terbuka untuk pemenang atau setelah event ditutup oleh admin.</p>`;

                        document.getElementById('giveaway-detail-content').innerHTML = `
                            <div class="detail-box">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                                    <h1 style="font-size:28px;">${g.title}</h1>
                                    <span class="badge badge-${g.status}">${g.status.toUpperCase()}</span>
                                </div>
                                <p style="color:var(--color-text-muted);margin-bottom:20px;white-space:pre-wrap;">${g.description || ''}</p>
                                ${winnerBox}
                                ${accountReveal}
                            </div>
                        `;
                    }
                } else if (hash === 'admin') {
                    if (!this.isAdmin) { this.navigate(''); return; }
                    document.getElementById('view-admin').style.display = 'block';
                    this.switchAdminTab('list');
                } else {
                    document.getElementById('view-home').style.display = 'block';
                }
            },

            copyAccount() {
                const accText = document.getElementById('acc-text').innerText;
                navigator.clipboard.writeText(accText).then(() => {
                    Toastify({ text: 'Detail akun disalin ke clipboard!', background: "#eab308", color: "#000" }).showToast();
                });
            },

            switchAdminTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                if (tab === 'list') {
                    document.getElementById('admin-tab-list').style.display = 'block';
                    document.getElementById('admin-tab-editor').style.display = 'none';
                    this.renderAdminList();
                } else if (tab === 'create') {
                    document.getElementById('admin-tab-list').style.display = 'none';
                    document.getElementById('admin-tab-editor').style.display = 'block';
                    document.getElementById('editor-heading').textContent = 'Buat Giveaway Baru';
                    document.getElementById('edit-id').value = '';
                    document.getElementById('edit-title').value = '';
                    document.getElementById('edit-desc').value = '';
                    document.getElementById('edit-account').value = '';
                    document.getElementById('edit-winner').value = '';
                    document.getElementById('edit-visibility').value = 'PUBLIC';
                    document.getElementById('edit-status').value = 'active';
                }
            },

            async saveGiveaway() {
                if (!this.isAdmin) return;
                const id = document.getElementById('edit-id').value || Date.now().toString();
                const title = document.getElementById('edit-title').value.trim();
                const desc = document.getElementById('edit-desc').value.trim();
                const account = document.getElementById('edit-account').value.trim();
                const winner = document.getElementById('edit-winner').value.trim();
                const visibility = document.getElementById('edit-visibility').value;
                const status = document.getElementById('edit-status').value;

                if (!title) { Swal.fire('Error', 'Judul giveaway wajib diisi!', 'error'); return; }

                try {
                    await setDoc(doc(db, "giveaways", id), { 
                        title, 
                        description: desc, 
                        accountDetails: account, 
                        winner, 
                        visibility, 
                        status, 
                        created: new Date().toISOString() 
                    });
                    Toastify({ text: "Berhasil disimpan!", background: "#eab308", color: "#000" }).showToast();
                    this.switchAdminTab('list');
                    this.loadGiveaways();
                } catch (e) {
                    Toastify({ text: "Gagal menyimpan!", style: { background: "#ef4444", color: "#fff" } }).showToast();
                }
            },

            editGiveaway(id) {
                const g = this.giveaways.find(item => item.id === id);
                if (!g) return;
                this.switchAdminTab('create');
                document.getElementById('editor-heading').textContent = 'Edit Giveaway';
                document.getElementById('edit-id').value = g.id;
                document.getElementById('edit-title').value = g.title;
                document.getElementById('edit-desc').value = g.description || '';
                document.getElementById('edit-account').value = g.accountDetails || '';
                document.getElementById('edit-winner').value = g.winner || '';
                document.getElementById('edit-visibility').value = g.visibility;
                document.getElementById('edit-status').value = g.status;
            },

            async deleteGiveaway(id) {
                Swal.fire({ title: 'Hapus giveaway ini?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Hapus' }).then(async (res) => {
                    if (res.isConfirmed) {
                        await deleteDoc(doc(db, "giveaways", id));
                        this.loadGiveaways();
                        Toastify({ text: "Berhasil dihapus" }).showToast();
                    }
                });
            },

            filterCategory(cat) {
                this.currentFilter = cat;
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                event.target.classList.add('active');
                this.renderGiveaways();
            },

            setSort(val) {
                if (val === 'created') this.giveaways.sort((a, b) => new Date(b.created) - new Date(a.created));
                else if (val === 'az') this.giveaways.sort((a, b) => a.title.localeCompare(b.title));
                this.renderGiveaways();
            },

            handleSearch(q) {
                const query = q.toLowerCase();
                const listEl = document.getElementById('giveaway-list');
                let filtered = this.giveaways.filter(g => g.title.toLowerCase().includes(query));
                listEl.innerHTML = filtered.map(g => `
                    <div class="giveaway-card" onclick="app.viewDetail('${g.id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center;mab-bottom:10px;">
                            <span class="giveaway-title">${g.title}</span>
                            <span class="badge badge-${g.status}">${g.status.toUpperCase()}</span>
                        </div>
                        <p class="card-description">${g.description || ''}</p>
                    </div>
                `).join('');
            }
        };

        app.init();
    </script>
</body>
</html>
