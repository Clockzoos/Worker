<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord User Lookup</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-400">Discord Lookup</h1>
        <p class="text-gray-400 text-sm mb-4 text-center">Masukkan Discord User ID untuk melihat informasi profil.</p>
        
        <div class="flex gap-2 mb-4">
            <input type="text" id="userId" placeholder="Contoh: 304834491953233920" 
                class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500">
            <button onclick="lookupUser()" 
                class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-semibold transition">
                Cari
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center text-gray-400 my-4">Sedang mencari...</div>

        <!-- Hasil / Result Box -->
        <div id="result" class="hidden mt-4 bg-gray-700/50 p-4 rounded-xl border border-gray-600">
            <div class="flex items-center gap-4 mb-3">
                <img id="avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full border-2 border-indigo-500 object-cover">
                <div>
                    <h2 id="username" class="font-bold text-lg">Username</h2>
                    <p id="tag" class="text-sm text-gray-400">tag</p>
                </div>
            </div>
            <div class="text-sm space-y-2">
                <p><strong>User ID:</strong> <span id="resId" class="font-mono text-indigo-300"></span></p>
                <p><strong>Dibuat Sejak:</strong> <span id="created" class="text-gray-300"></span></p>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden mt-4 bg-red-900/50 border border-red-600 text-red-200 p-3 rounded-lg text-sm text-center"></div>
    </div>

    <script>
        async function lookupUser() {
            const userId = document.getElementById('userId').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            // Reset tampilan
            result.classList.add('hidden');
            error.classList.add('hidden');

            if (!userId) {
                error.innerText = "Masukkan User ID terlebih dahulu!";
                error.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');

            try {
                // Menggunakan API publik untuk lookup Discord ID (Contoh menggunakan API lurl.cc / discord lookup alternatif)
                // Kamu juga bisa mengganti endpoint ini jika punya backend sendiri
                const response = await fetch(`https://some-random-api.com/others/discorduser?id=${userId}`);
                
                if (!response.ok) throw new Error("Gagal mengambil data atau User ID tidak ditemukan.");

                const data = await response.json();
                
                // Set data ke HTML
                document.getElementById('avatar').src = data.avatar?.url || 'https://cdn.discordapp.com/embed/avatars/0.png';
                document.getElementById('username').innerText = data.username;
                document.getElementById('tag').innerText = `#${data.discriminator || '0'}`;
                document.getElementById('resId').innerText = data.id;
                
                // Hitung estimasi waktu pembuatan akun dari ID (Discord Snowflake to Timestamp)
                const createdTimestamp = Number((BigInt(userId) >> 22n) + 1420070400000n);
                document.getElementById('created').innerText = new Date(createdTimestamp).toLocaleString();

                result.classList.remove('hidden');
            } catch (err) {
                error.innerText = "Terjadi kesalahan atau User ID tidak valid / tidak ditemukan.";
                error.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
